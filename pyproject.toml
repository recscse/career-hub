[project]
name = "career-context-hub"
version = "0.1.0"
description = "Your developer career context (resume, skills, jobs, applications) as an MCP server for AI coding tools. Local-first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "recscse" }]
keywords = ["mcp", "model-context-protocol", "career", "resume", "job-search", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/recscse/career-hub"
Issues = "https://github.com/recscse/career-hub/issues"

[project.scripts]
career-context-hub = "career_hub.server:main"
career-hub = "career_hub.server:main"
career-hub-admin = "career_hub.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_hub"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
