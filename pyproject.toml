[project]
name = "career-hub"
version = "0.1.0"
description = "Career Context Hub: developer context + job tracking, served to AI agents over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[project.scripts]
career-hub = "career_hub.server:main"
career-hub-admin = "career_hub.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_hub"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
